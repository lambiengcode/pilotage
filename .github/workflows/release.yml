name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners for every target. `rusqlite` bundles SQLite and compiles it
          # from C, so cross-compiling would drag in a cross toolchain for no benefit
          # when GitHub already provides a runner of each architecture.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify the binary runs
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/pilotage"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="${BIN}.exe"
          fi
          "$BIN" --version
          # A release whose built-in packs do not validate is a broken release.
          "$BIN" pack validate

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          NAME="pilotage-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pilotage.exe" "dist/$NAME/"
          else
            cp "target/${{ matrix.target }}/release/pilotage" "dist/$NAME/"
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$NAME/"

          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${NAME}.zip" "$NAME" > /dev/null
            ARCHIVE="${NAME}.zip"
          else
            tar czf "${NAME}.tar.gz" "$NAME"
            ARCHIVE="${NAME}.tar.gz"
          fi

          # Checksums travel with the archive so install.sh can verify a download.
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
          fi
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd artifacts
          cat ./*.sha256 > SHA256SUMS
          rm -f ./*.sha256
          ls -la

      - name: Extract release notes for this tag
        id: notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull just this version's section out of the changelog.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## \[/     { exit }
            inside                 { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
