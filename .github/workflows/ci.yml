name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The suite is hermetic: integration tests drive the compiled binary against a
      # local mock server, so nothing here reaches the network.
      - run: cargo test --all-targets --locked

  msrv:
    # The version lives in the matrix, not in `env`: the `env` context is not available
    # in a job's `name`, and defining it twice would let the two drift apart.
    name: msrv ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.88"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # Checks the version declared in Cargo.toml's `rust-version` still builds, so the
      # README's install requirement cannot quietly drift.
      - run: cargo check --all-targets --locked

  packs:
    name: packs validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A shipped pack with a bad threshold or a metric pointing at a fact no source
      # produces is a broken release, and it is cheap to catch here.
      - run: cargo run --locked --release -- pack validate

  install-script:
    name: install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        # Severity `style` is the strictest level, so CI cannot be laxer than a local run.
        run: shellcheck -S style install.sh
      - name: Dry run resolves a target triple
        run: sh install.sh --dry-run
