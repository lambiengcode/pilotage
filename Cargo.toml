[package]
name = "pilotage"
version = "0.1.0"
edition = "2024"
description = "Agent-ergonomic research CLI: market, project and technical due diligence, returned as TOON"
license = "MIT"
readme = "README.md"
keywords = ["cli", "agent", "research", "toon", "axi"]
categories = ["command-line-utilities"]
rust-version = "1.88"
# Two binaries exist (pilotage and bench), so `cargo run` needs to know which one.
default-run = "pilotage"
repository = "https://github.com/lambiengcode/pilotage"

# Startup latency is a per-invocation tax an agent pays dozens of times a session,
# and binary size matters for a tool distributed as a prebuilt artifact.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "gzip", "brotli", "rustls", "http2", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }
toml = "1.1.4"
